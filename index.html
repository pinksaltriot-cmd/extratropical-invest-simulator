<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extratropical Invest Simulator</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#061625; --panel:#0d1b2a; --panel2:#12293f; --edge:#1b3a5b;
    --ink:#cbd5e1; --ink2:#94a3b8; --accent:#4f9cf9; --accentwarm:#f97316;
    --head:#7fb3cc;
    --snow:#93c5fd; --rain:#6ee7b7; --thunder:#fbbf24; --drizzle:#5eead4;
    --ice:#c084fc; --sleet:#fbbf24; --mist:#a5f3fc; --neutral:#9ca3af;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:12px 18px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;font-weight:700;color:#e2e8f0}
  header .sub{color:var(--ink2);font-size:12px}
  .app{display:flex;align-items:stretch;min-height:calc(100vh - 49px)}
  aside{flex:0 0 320px;border-right:1px solid var(--edge);padding:14px;overflow:auto}
  main{flex:1;padding:14px;overflow:auto}
  @media (max-width:820px){ .app{flex-direction:column} aside{flex:none;border-right:none;border-bottom:1px solid var(--edge)} }
  h2.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--head);margin:16px 0 8px}
  .selftest{max-width:720px;margin:0 auto;padding:20px;font-family:ui-monospace,Menlo,monospace}
  .selftest .pass{color:#4ade80}.selftest .fail{color:#f87171}
  .selftest .sum{font-size:18px;font-weight:700;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <span style="font-size:20px">🌀</span>
  <h1>Extratropical Invest Simulator</h1>
  <span class="sub">deterministic cold-core life-cycle model</span>
</header>

<div class="app" id="app">
  <aside id="inputs"><!-- Task 11 --></aside>
  <main id="results"><!-- Task 10 + 12 --></main>
</div>

<div class="selftest" id="selftest" style="display:none"></div>

<script>
"use strict";
const EIS = {};
window.__eisTests = window.__eisTests || [];

window.__eisTests.push((t) => {
  t('harness alive', 1 + 1 === 2);
});

window.__eisTests.push((t) => {
  const ids = ['lightrain','modrain','heavyrain','lightsnow','modsnow','heavysnow',
    'lightdrizzle','moddrizzle','heavydrizzle','ice','sleet','snowgrains','hail',
    'thunderstorm','thundersnow','fog','haze','mist'];
  t('18 precip types defined', ids.length === 18 && ids.every(id => EIS.PRECIP_META[id]));
  t('each precip has label+color+emoji', ids.every(id => {
    const m = EIS.PRECIP_META[id]; return m.label && m.color && m.emoji;
  }));
  t('4 regions defined', EIS.REGIONS.length === 4 && EIS.REGIONS[0] === 'Comma head');
  t('input defaults present', EIS.DEFAULT_INPUTS.baroclinicity === 70 &&
     EIS.DEFAULT_INPUTS.surfaceType === 'sea');
});

window.__eisTests.push((t, approx) => {
  const n = EIS.normalizeInputs(EIS.DEFAULT_INPUTS);
  t('normalize b in 0..1', approx(n.b, 0.70, 1e-6));
  t('normalize month parsed', n.month === 1);
  t('season: NH January is high', EIS.seasonFactor(1, 44) > 0.9);
  t('season: NH July is low', EIS.seasonFactor(7, 44) < 0.1);
  t('season: SH flips', EIS.seasonFactor(7, -44) > 0.9);
  t('shear sweet spot ~20mph = 1', approx(EIS.shearFactor(20), 1, 1e-6));
  t('shear too high penalized', EIS.shearFactor(70) < 0.2);
  t('shear too low penalized', EIS.shearFactor(0) < EIS.shearFactor(20));
});

window.__eisTests.push((t) => {
  const strongWinter = EIS.normalizeInputs({...EIS.DEFAULT_INPUTS,
    baroclinicity:95, shearMph:20, humidityPct:90, latitudeDeg:48, advisoryISO:'2026-01-10T18:00'});
  const weakSummer = EIS.normalizeInputs({...EIS.DEFAULT_INPUTS,
    baroclinicity:10, shearMph:5, humidityPct:30, latitudeDeg:15, advisoryISO:'2026-07-10T18:00'});
  const dpStrong = EIS.developmentPotential(strongWinter);
  const dpWeak = EIS.developmentPotential(weakSummer);
  t('strong winter DP high', dpStrong > 0.75);
  t('weak summer DP low', dpWeak < 0.30);
  t('excessive shear kills DP', EIS.developmentPotential(
      {...strongWinter, shearMph:75}) < dpStrong * 0.7);
  t('DP bounded 0..1', dpStrong <= 1 && dpWeak >= 0);
});

window.__eisTests.push((t, approx) => {
  const strong = EIS.normalizeInputs({...EIS.DEFAULT_INPUTS,
    baroclinicity:95, shearMph:20, humidityPct:90, latitudeDeg:48, investStrength:55,
    advisoryISO:'2026-01-10T18:00'});
  const weak = EIS.normalizeInputs({...EIS.DEFAULT_INPUTS,
    baroclinicity:10, shearMph:5, humidityPct:30, latitudeDeg:15, investStrength:15,
    advisoryISO:'2026-07-10T18:00'});
  const ps = EIS.pressureProfile(strong), pw = EIS.pressureProfile(weak);
  t('starts near ambient', approx(ps.pressureAt(0), ps.ambient, 4));
  t('strong deepens a lot', (ps.ambient - ps.pressureAt(ps.tPeakH)) > 25);
  t('weak deepens little', (pw.ambient - pw.pressureAt(pw.tPeakH)) < 12);
  t('fills back toward ambient', ps.pressureAt(ps.tDeathH) > ps.pressureAt(ps.tPeakH) + 10);
  const drop24 = ps.pressureAt(ps.tPeakH-0) - ps.pressureAt(Math.max(0,ps.tPeakH-24));
  t('strong bombs out (>=24mb/24h somewhere)', Math.abs(drop24) >= 20);
  t('death after peak', ps.tDeathH > ps.tPeakH);
});

window.__eisTests.push((t, approx) => {
  const w40 = EIS.windFromDeficit(40), w10 = EIS.windFromDeficit(10);
  t('deeper = stronger', w40.sustained > w10.sustained);
  t('gust > sustained', w40.gust > w40.sustained);
  t('40mb ~ 76 mph', approx(w40.sustained, 76, 3));
  const small = EIS.sizeAt(20, 0.1), big = EIS.sizeAt(40, 0.9);
  t('grows with maturity/depth', big.radiusMi > small.radiusMi);
  t('category labels', ['compact','average','broad'].includes(big.category));
});

/* ================= CONSTANTS (Task 1) ================= */
EIS.PRECIP_META = {
  lightrain:    {label:'Light rain',    emoji:'\u{1F327}️', color:'var(--rain)',    water:'liquid'},
  modrain:      {label:'Moderate rain', emoji:'\u{1F327}️', color:'var(--rain)',    water:'liquid'},
  heavyrain:    {label:'Heavy rain',    emoji:'\u{1F327}️', color:'var(--rain)',    water:'liquid'},
  lightsnow:    {label:'Light snow',    emoji:'❄️',    color:'var(--snow)',    water:'snow'},
  modsnow:      {label:'Moderate snow', emoji:'❄️',    color:'var(--snow)',    water:'snow'},
  heavysnow:    {label:'Heavy snow',    emoji:'❄️',    color:'var(--snow)',    water:'snow'},
  lightdrizzle: {label:'Light drizzle', emoji:'\u{1F326}️', color:'var(--drizzle)', water:'liquid'},
  moddrizzle:   {label:'Moderate drizzle',emoji:'\u{1F326}️',color:'var(--drizzle)',water:'liquid'},
  heavydrizzle: {label:'Heavy drizzle', emoji:'\u{1F326}️', color:'var(--drizzle)', water:'liquid'},
  ice:          {label:'Ice / freezing rain', emoji:'\u{1F9CA}', color:'var(--ice)',    water:'liquid'},
  sleet:        {label:'Sleet',         emoji:'⛈️',    color:'var(--sleet)',   water:'liquid'},
  snowgrains:   {label:'Snow grains',   emoji:'❄️',    color:'var(--snow)',    water:'snow'},
  hail:         {label:'Hail',          emoji:'\u{1F327}️', color:'var(--thunder)', water:'liquid'},
  thunderstorm: {label:'Thunderstorms', emoji:'⛈️',    color:'var(--thunder)', water:'liquid'},
  thundersnow:  {label:'Thundersnow',   emoji:'⛈️',    color:'var(--thunder)', water:'snow'},
  fog:          {label:'Fog',           emoji:'\u{1F32B}️', color:'var(--neutral)', water:'none'},
  haze:         {label:'Haze',          emoji:'\u{1F301}',       color:'var(--neutral)', water:'none'},
  mist:         {label:'Mist',          emoji:'\u{1F4A7}',       color:'var(--mist)',    water:'none'},
};
EIS.REGIONS = ['Comma head','Warm front','Cold front','Warm sector'];
// Per-region physical character: lift (precip efficiency), tempOffset (°F vs storm env),
// convective flag (can produce thunder/thundersnow/hail).
EIS.REGION_PROPS = {
  'Comma head':  {lift:1.00, tempOffset:-12, convective:true},
  'Warm front':  {lift:0.60, tempOffset:-4,  convective:false},
  'Cold front':  {lift:0.80, tempOffset:-2,  convective:true},
  'Warm sector': {lift:0.25, tempOffset:+6,  convective:false},
};
EIS.DEFAULT_INPUTS = {
  surfaceType:'sea', surfaceTempF:52, baroclinicity:70, shearMph:22, humidityPct:80,
  latitudeDeg:44, lonDeg:-58, steeringDirDeg:60, steeringMph:30, investStrength:45,
  advisoryISO:'2026-01-10T18:00',
};
/* ================= ENGINE (Tasks 2-9) ================= */
EIS.clamp = (x,lo,hi) => Math.max(lo, Math.min(hi, x));

EIS.normalizeInputs = function(raw){
  const d = new Date(raw.advisoryISO);
  const month = (isNaN(d) ? 1 : d.getMonth()+1);
  return {
    surfaceType: raw.surfaceType,
    tempF: +raw.surfaceTempF,
    b: EIS.clamp(+raw.baroclinicity/100, 0, 1),
    shearMph: +raw.shearMph,
    h: EIS.clamp(+raw.humidityPct/100, 0, 1),
    lat: +raw.latitudeDeg,
    lon: +raw.lonDeg,
    dir: +raw.steeringDirDeg,
    spd: +raw.steeringMph,
    s0: EIS.clamp(+raw.investStrength/100, 0, 1),
    month, date: (isNaN(d) ? new Date('2026-01-10T18:00') : d),
  };
};

// 1 = deep winter for that hemisphere, 0 = deep summer.
EIS.seasonFactor = function(month, latitudeDeg){
  const north = latitudeDeg >= 0;
  // NH coldest at Jan (month 1); SH coldest at Jul (month 7).
  const phase = north ? (month - 1) : (month - 7);
  return 0.5 + 0.5 * Math.cos(phase / 12 * 2 * Math.PI);
};

// Sweet spot at 20 mph; falls off both ways, floored at 0.
EIS.shearFactor = function(shearMph){
  return EIS.clamp(1 - Math.pow((shearMph - 20) / 35, 2), 0, 1);
};

// Composite 0..1 development-potential score: baroclinicity + humidity +
// latitude sweet spot (~50°) + seasonal favorability, tempered by shear.
EIS.developmentPotential = function(n){
  const latF = EIS.clamp(1 - Math.pow((Math.abs(n.lat) - 50) / 40, 2), 0.1, 1);
  const seaF = EIS.seasonFactor(n.month, n.lat);
  const shearF = EIS.shearFactor(n.shearMph);
  const base = 0.50*n.b + 0.15*n.h + 0.20*latF + 0.15*seaF; // 0..1
  return EIS.clamp(base * (0.4 + 0.6*shearF), 0, 1);
};

// Deterministic deepen/fill pressure life cycle: sin^1.3 ramp to a minimum
// central pressure at tPeakH, then exponential fill; death = first 6-hourly
// mark after peak where the deficit drops below 3 mb (cap 240 h).
EIS.pressureProfile = function(n){
  const dp = EIS.developmentPotential(n);
  const seaF = EIS.seasonFactor(n.month, n.lat);
  const ambient = 1013;
  const depthMb = 5 + dp*45 + seaF*10;            // 5..60 mb
  const tPeakH = 30 + (1-dp)*36 + (1-n.s0)*18;     // ~30..84 h, strong+organized peak sooner
  const fillK = 0.9;                                // fill slower than deepen
  function shape(tH){
    const x = tH / tPeakH;
    if (x <= 0) return 0;
    if (x <= 1) return Math.pow(Math.sin(x*Math.PI/2), 1.3); // 0 -> 1
    return Math.exp(-fillK*(x-1));                            // 1 -> 0 (fills)
  }
  function deficitAt(tH){ return depthMb * shape(tH); }
  function pressureAt(tH){ return ambient - deficitAt(tH); }
  // Death: first 6-hourly time after peak where deficit < 3 mb (cap 240 h).
  let tDeathH = tPeakH;
  for (let th = Math.ceil(tPeakH/6)*6; th <= 240; th += 6){
    if (deficitAt(th) < 3){ tDeathH = th; break; }
    tDeathH = th;
  }
  return { ambient, depthMb, tPeakH, tDeathH, deficitAt, pressureAt, dp };
};
// Pressure-wind relation: sustained wind (mph) scales with sqrt of the
// central-pressure deficit vs ambient; gust factor 1.35x sustained.
EIS.windFromDeficit = function(deficitMb){
  const sustained = 12 * Math.sqrt(Math.max(0, deficitMb));  // mph
  return { sustained: Math.round(sustained), gust: Math.round(sustained*1.35) };
};

// Wind-field radius (mi): grows with both depth (deficitMb) and maturity
// (ageFrac, 0..1 through the life cycle). Category label from size bands.
EIS.sizeAt = function(deficitMb, ageFrac){
  const radius = 60 + deficitMb*3 + EIS.clamp(ageFrac,0,1)*90;
  const radiusMi = Math.round(radius);
  const category = radiusMi < 120 ? 'compact' : radiusMi <= 260 ? 'average' : 'broad';
  return { radiusMi, category };
};
// dirDeg: compass heading the system moves toward (0=N,90=E). Adds modest
// poleward + eastward drift typical of extratropical lows.
EIS.advanceTrack = function(lat, lon, dirDeg, spdMph, dtH, dp){
  const distMi = spdMph * dtH;
  const br = dirDeg * Math.PI/180;
  const latRad = lat * Math.PI/180;
  let dLat = (distMi * Math.cos(br)) / 69;
  let dLon = (distMi * Math.sin(br)) / (69 * Math.max(0.2, Math.cos(latRad)));
  const pole = lat >= 0 ? 1 : -1;
  dLat += pole * (0.15 + 0.4*dp);   // beta / poleward drift
  dLon += 0.35 + 0.3*dp;            // eastward drift
  const nlat = EIS.clamp(lat + dLat, -85, 85);
  let nlon = lon + dLon; if (nlon > 180) nlon -= 360; if (nlon < -180) nlon += 360;
  const headingDeg = (Math.atan2(dLon*Math.cos(latRad), dLat) * 180/Math.PI + 360) % 360;
  const speedMph = Math.round((Math.hypot(dLat*69, dLon*69*Math.cos(latRad)))/dtH);
  return { lat:nlat, lon:nlon, headingDeg:Math.round(headingDeg), speedMph };
};
EIS.coreTemp = function(n, ageFrac, dp){
  const seaF = EIS.seasonFactor(n.month, n.lat);
  const tempF = Math.round(n.tempF - (15 + 25*seaF + 0.4*Math.abs(n.lat)));
  // Near peak, a strong system can warm-seclude its core.
  const warmSeclusion = dp > 0.7 && ageFrac > 0.45 && ageFrac < 0.75;
  const tag = warmSeclusion ? 'warm seclusion' : 'cold-core';
  return { tempF, tag };
};
EIS.classifyPrecip = function(kind, rateInHr){
  if (kind === 'rain')    return rateInHr > 0.3 ? 'heavyrain'  : rateInHr >= 0.1  ? 'modrain'    : 'lightrain';
  if (kind === 'snow')    return rateInHr > 1.5 ? 'heavysnow'  : rateInHr >= 0.5  ? 'modsnow'    : 'lightsnow';
  if (kind === 'drizzle') return rateInHr > 0.05? 'heavydrizzle':rateInHr >= 0.02 ? 'moddrizzle' : 'lightdrizzle';
  return 'lightrain';
};

EIS.precipForRegion = function(region, n, dp){
  const p = EIS.REGION_PROPS[region];
  const seaF = EIS.seasonFactor(n.month, n.lat);
  const regionTempF = n.tempF + p.tempOffset - 25*seaF*(Math.abs(n.lat)/90);
  // Liquid-equivalent precip rate (in/hr).
  const liquidEq = EIS.clamp(dp * n.h * p.lift * 2.2, 0, 3);

  if (liquidEq < 0.005){
    // Non-precipitating obscuration.
    if (n.h > 0.9) return mk('fog');
    if (n.h > 0.75) return mk('mist');
    if (n.h < 0.4) return mk('haze');
    return null;
  }
  const unstable = p.convective && n.tempF > 45 && dp > 0.5;
  let type, water, rateInHr;
  if (regionTempF < 30){                                  // frozen
    const snowRate = liquidEq * 10;
    if (p.convective && dp > 0.6 && snowRate > 0.5){ type='thundersnow'; }
    else if (snowRate < 0.15 && p.lift < 0.4){ type='snowgrains'; }
    else { type = EIS.classifyPrecip('snow', snowRate); }
    water='snow'; rateInHr = round2(snowRate);
  } else if (regionTempF < 36){                           // mixed
    type = regionTempF >= 33 ? 'sleet' : 'ice'; water='liquid'; rateInHr = round2(liquidEq);
  } else {                                                // liquid
    if (unstable && liquidEq > 0.25){ type = (dp>0.75 && liquidEq>0.6) ? 'hail' : 'thunderstorm'; }
    else if (p.lift <= 0.3 && liquidEq < 0.1){ type = EIS.classifyPrecip('drizzle', liquidEq); }
    else { type = EIS.classifyPrecip('rain', liquidEq); }
    water='liquid'; rateInHr = round2(liquidEq);
  }
  return { region, type, rateInHr, accumIn: round2(rateInHr*6), water };

  function mk(id){ return { region, type:id, rateInHr:0, accumIn:0, water:'none' }; }
  function round2(x){ return Math.round(x*100)/100; }
};

EIS.precipByRegion = function(n, dp){
  return EIS.REGIONS.map(r => EIS.precipForRegion(r, n, dp)).filter(Boolean);
};

// deficitFrac = current pressure deficit / max depth (0..1). Odds track organization,
// peaking with intensity and falling as the low fills.
EIS.formationOdds = function(n, dp, deficitFrac){
  return Math.round(EIS.clamp(100 * (0.30*n.s0 + dp*EIS.clamp(deficitFrac,0,1)), 0, 100));
};
EIS.phaseNote = function(trend24, deficitMb, depthMb, dying){
  if (dying || deficitMb < 3) return 'dissipating';
  if (trend24 <= -24) return 'bombing out';
  if (trend24 < -3) return 'deepening';
  if (trend24 > 3) return 'occluding';
  return deficitMb > 0.6*depthMb ? 'at peak' : 'organizing';
};
EIS.simulate = function(raw){
  const n = EIS.normalizeInputs(raw);
  const dp = EIS.developmentPotential(n);
  const prof = EIS.pressureProfile(n);
  const steps = [];
  let lat = n.lat, lon = n.lon;
  const totals = { snowIn:0, liquidIn:0 };
  let peakIndex = 0, minP = Infinity;

  for (let i=0, tH=0; tH <= prof.tDeathH; i++, tH += 6){
    const deficit = prof.deficitAt(tH);
    const pressureMb = Math.round(prof.pressureAt(tH));
    const ageFrac = tH / prof.tDeathH;
    const deficitFrac = deficit / prof.depthMb;

    if (i > 0){
      const mv = EIS.advanceTrack(lat, lon, n.dir, n.spd, 6, dp);
      lat = mv.lat; lon = mv.lon; var heading = mv.headingDeg, speed = mv.speedMph;
    } else { heading = n.dir; speed = n.spd; }

    const wind = EIS.windFromDeficit(deficit);
    const size = EIS.sizeAt(deficit, ageFrac);
    const core = EIS.coreTemp(n, ageFrac, dp);
    const regions = EIS.precipByRegion(n, dp * EIS.clamp(deficitFrac+0.15,0,1));
    regions.forEach(rg => {
      if (rg.water === 'snow') totals.snowIn += rg.accumIn;
      else if (rg.water === 'liquid') totals.liquidIn += rg.accumIn;
    });
    const prev24 = steps.length >= 4 ? steps[steps.length-4].pressureMb : pressureMb;
    const trend24 = pressureMb - prev24;
    const dying = tH >= prof.tPeakH && deficit < 3;

    const step = {
      index:i, tHours:tH,
      date: new Date(n.date.getTime() + tH*3600*1000).toISOString(),
      formationPct: EIS.formationOdds(n, dp, deficitFrac),
      pressureMb, pressureTrend24: Math.round(trend24),
      windMph: wind.sustained, gustMph: wind.gust,
      sizeMi: size.radiusMi, sizeCat: size.category,
      lat: Math.round(lat*10)/10, lon: Math.round(lon*10)/10,
      headingDeg: heading, speedMph: speed,
      coreTempF: core.tempF, coreTag: core.tag,
      phaseNote: EIS.phaseNote(trend24, deficit, prof.depthMb, dying),
      regions,
      stormTotals: { snowIn: Math.round(totals.snowIn*10)/10,
                     liquidIn: Math.round(totals.liquidIn*10)/10 },
    };
    steps.push(step);
    if (pressureMb < minP){ minP = pressureMb; peakIndex = i; }
  }
  return { ambient: prof.ambient, peakIndex, steps };
};
/* ================= MAP (Task 10) ================= */
/* ================= UI (Tasks 11-13) ================= */

window.__eisTests.push((t, approx) => {
  // Pure east steering (dir=90) at 30 mph for 6 h ~ 180 mi ~ 2.6° lon at 44N.
  const a = EIS.advanceTrack(44, -58, 90, 30, 6, 0.5);
  t('moves east', a.lon > -58);
  t('lat drifts poleward (north)', a.lat > 44);
  t('heading reported', a.headingDeg >= 0 && a.headingDeg <= 360);
  const cold = EIS.coreTemp(EIS.normalizeInputs({...EIS.DEFAULT_INPUTS,
    surfaceTempF:40, latitudeDeg:55, advisoryISO:'2026-01-10T18:00'}), 0.3, 0.8);
  t('cold-core colder than surface', cold.tempF < 40);
  t('cold tag', /core/.test(cold.tag));
});

window.__eisTests.push((t) => {
  t('classify rain heavy', EIS.classifyPrecip('rain', 0.5) === 'heavyrain');
  t('classify rain light', EIS.classifyPrecip('rain', 0.05) === 'lightrain');
  t('classify snow moderate', EIS.classifyPrecip('snow', 1.0) === 'modsnow');
  t('classify drizzle light', EIS.classifyPrecip('drizzle', 0.01) === 'lightdrizzle');

  const winter = EIS.normalizeInputs({...EIS.DEFAULT_INPUTS,
    surfaceTempF:34, baroclinicity:95, humidityPct:90, latitudeDeg:48,
    advisoryISO:'2026-01-10T18:00'});
  const dpW = EIS.developmentPotential(winter);
  const rows = EIS.precipByRegion(winter, dpW);
  const byRegion = Object.fromEntries(rows.map(r => [r.region, r]));
  t('produces multiple regions', rows.length >= 3);
  t('comma head is frozen/heavy', /snow/.test(byRegion['Comma head'].type));
  t('cold front convective', ['thunderstorm','thundersnow','hail']
      .includes(byRegion['Cold front'].type) || /rain|snow/.test(byRegion['Cold front'].type));

  const summer = EIS.normalizeInputs({...EIS.DEFAULT_INPUTS,
    surfaceTempF:70, baroclinicity:20, humidityPct:40, latitudeDeg:20,
    advisoryISO:'2026-07-10T18:00'});
  const dpS = EIS.developmentPotential(summer);
  const srows = EIS.precipByRegion(summer, dpS);
  t('summer mostly liquid', srows.every(r => EIS.PRECIP_META[r.type].water !== 'snow'));
});

window.__eisTests.push((t) => {
  const n = EIS.normalizeInputs({...EIS.DEFAULT_INPUTS, baroclinicity:90, shearMph:20});
  const dp = EIS.developmentPotential(n);
  const early = EIS.formationOdds(n, dp, 0.2);
  const peak  = EIS.formationOdds(n, dp, 1.0);
  const late  = EIS.formationOdds(n, dp, 0.15);
  t('odds rise toward peak', peak > early);
  t('odds bounded 0..100', peak <= 100 && late >= 0);
  t('bombing note at big drop', EIS.phaseNote(-26, 40, 45, false) === 'bombing out');
  t('dissipating when dying', EIS.phaseNote(5, 2, 45, true) === 'dissipating');
  t('deepening note', EIS.phaseNote(-8, 20, 45, false) === 'deepening');
});

window.__eisTests.push((t) => {
  const winter = {...EIS.DEFAULT_INPUTS, baroclinicity:95, shearMph:20, humidityPct:90,
    latitudeDeg:48, investStrength:55, surfaceTempF:34, advisoryISO:'2026-01-10T18:00'};
  const r = EIS.simulate(winter);
  t('produces multiple 6-h steps', r.steps.length >= 5);
  t('step spacing 6 h', r.steps[1].tHours - r.steps[0].tHours === 6);
  const pressures = r.steps.map(s => s.pressureMb);
  const minP = Math.min(...pressures);
  t('deepens then fills', pressures[0] > minP && pressures[pressures.length-1] > minP + 8);
  t('peakIndex marks min pressure', r.steps[r.peakIndex].pressureMb === minP);
  t('winter has snow somewhere', r.steps.some(s =>
      s.regions.some(rg => EIS.PRECIP_META[rg.type].water === 'snow')));
  t('storm totals accumulate', r.steps[r.steps.length-1].stormTotals.snowIn >= 0);

  // Determinism: identical inputs -> identical serialized result.
  const a = JSON.stringify(EIS.simulate(winter));
  const b = JSON.stringify(EIS.simulate(winter));
  t('deterministic', a === b);

  const summer = EIS.simulate({...EIS.DEFAULT_INPUTS, baroclinicity:12, shearMph:6,
    humidityPct:35, latitudeDeg:18, investStrength:15, surfaceTempF:72,
    advisoryISO:'2026-07-10T18:00'});
  t('weak summer barely develops', (1013 - Math.min(...summer.steps.map(s=>s.pressureMb))) < 14);
});

/* ================= SELF-TEST HARNESS ================= */
(function(){
  if (!/(\?|&)selftest\b/.test(location.search)) return;
  document.getElementById('app').style.display='none';
  const el = document.getElementById('selftest'); el.style.display='block';
  let pass=0, fail=0; const rows=[];
  function approx(a,b,tol){ return Math.abs(a-b) <= (tol==null?1e-6:tol); }
  function t(name, cond){
    if (cond){ pass++; rows.push('<div class="pass">✓ '+name+'</div>'); }
    else { fail++; rows.push('<div class="fail">✗ '+name+'</div>'); }
  }
  (window.__eisTests||[]).forEach((fn, gi) => {
    try { fn(t, approx); }
    catch(e){ fail++; rows.push('<div class="fail">✗ test group #'+gi+' threw: '+((e && e.message) || String(e))+'</div>'); }
  });
  const total = pass+fail;
  el.innerHTML = '<div class="sum '+(fail?'fail':'pass')+'">SELFTEST '+pass+'/'+total+' '+(fail?'FAIL':'PASS')+'</div>'+rows.join('');
  console.log('SELFTEST '+pass+'/'+total+' '+(fail?'FAIL':'PASS'));
})();
</script>
